name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages for headless OpenGL
        # Runner images usually ship these already; only touch apt (and its mirrors) when one is missing.
        run: |
          missing=""
          for pkg in xvfb libgl1-mesa-dri; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          else
            echo "xvfb and Mesa are already installed"
          fi
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Smoke test (real game, autoplay bot)
        env:
          BALLOON_SHOOTER_SMOKE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest -q tests/test_smoke.py
